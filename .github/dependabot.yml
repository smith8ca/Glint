# Dependabot opens update pull requests against dev, never main: main only
# receives release merges from dev.
version: 2
updates:
  - package-ecosystem: npm
    directory: /webhook-receiver
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types must match the Node major the project runs on (see engines.node).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # One pull request for all minor and patch updates; majors come separately.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e-test
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types must match the Node major the project runs on (see engines.node).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /webhook-receiver
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # The Node major is a deliberate choice (engines.node, CI and docs name it).
      - dependency-name: node
        update-types: ['version-update:semver-major']
