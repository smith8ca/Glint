---
name: Release

# main → next patch tag vX.Y.Z, images :vX.Y.Z and :latest, GitHub Release
# dev  → image :dev
# Images are published to GitHub Container Registry (ghcr.io/<owner>/<repo>).
on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and releases
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for tag listing

      - name: Compute image tags and next version
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
            LATEST=${LATEST:-v0.0.0}
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "Cutting release $VERSION (previous: $LATEST)"
          else
            echo "tags=$IMAGE:dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./webhook-receiver
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create tag and GitHub Release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --generate-notes
