<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <filter id="glow-b" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-b-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bottom-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FC6D26" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FC6D26" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="banner-clip">
      <rect width="1280" height="400" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="#0F172A"/>

  <!-- Subtle decorative grid dots in background -->
  <g opacity="0.08" fill="#94A3B8">
    <!-- Row 1 -->
    <circle cx="60" cy="40" r="2"/>
    <circle cx="120" cy="40" r="2"/>
    <circle cx="180" cy="40" r="2"/>
    <circle cx="240" cy="40" r="2"/>
    <circle cx="300" cy="40" r="2"/>
    <circle cx="900" cy="40" r="2"/>
    <circle cx="960" cy="40" r="2"/>
    <circle cx="1020" cy="40" r="2"/>
    <circle cx="1080" cy="40" r="2"/>
    <circle cx="1140" cy="40" r="2"/>
    <circle cx="1200" cy="40" r="2"/>
    <!-- Row 2 -->
    <circle cx="60" cy="100" r="2"/>
    <circle cx="120" cy="100" r="2"/>
    <circle cx="180" cy="100" r="2"/>
    <circle cx="240" cy="100" r="2"/>
    <circle cx="300" cy="100" r="2"/>
    <circle cx="900" cy="100" r="2"/>
    <circle cx="960" cy="100" r="2"/>
    <circle cx="1020" cy="100" r="2"/>
    <circle cx="1080" cy="100" r="2"/>
    <circle cx="1140" cy="100" r="2"/>
    <circle cx="1200" cy="100" r="2"/>
    <!-- Row 3 -->
    <circle cx="60" cy="160" r="2"/>
    <circle cx="120" cy="160" r="2"/>
    <circle cx="180" cy="160" r="2"/>
    <circle cx="240" cy="160" r="2"/>
    <circle cx="300" cy="160" r="2"/>
    <circle cx="900" cy="160" r="2"/>
    <circle cx="960" cy="160" r="2"/>
    <circle cx="1020" cy="160" r="2"/>
    <circle cx="1080" cy="160" r="2"/>
    <circle cx="1140" cy="160" r="2"/>
    <circle cx="1200" cy="160" r="2"/>
    <!-- Row 4 -->
    <circle cx="60" cy="220" r="2"/>
    <circle cx="120" cy="220" r="2"/>
    <circle cx="180" cy="220" r="2"/>
    <circle cx="900" cy="220" r="2"/>
    <circle cx="960" cy="220" r="2"/>
    <circle cx="1020" cy="220" r="2"/>
    <circle cx="1080" cy="220" r="2"/>
    <circle cx="1140" cy="220" r="2"/>
    <circle cx="1200" cy="220" r="2"/>
    <!-- Row 5 -->
    <circle cx="60" cy="280" r="2"/>
    <circle cx="120" cy="280" r="2"/>
    <circle cx="180" cy="280" r="2"/>
    <circle cx="900" cy="280" r="2"/>
    <circle cx="960" cy="280" r="2"/>
    <circle cx="1020" cy="280" r="2"/>
    <circle cx="1080" cy="280" r="2"/>
    <circle cx="1140" cy="280" r="2"/>
    <circle cx="1200" cy="280" r="2"/>
    <!-- Row 6 -->
    <circle cx="60" cy="340" r="2"/>
    <circle cx="120" cy="340" r="2"/>
    <circle cx="900" cy="340" r="2"/>
    <circle cx="960" cy="340" r="2"/>
    <circle cx="1020" cy="340" r="2"/>
    <circle cx="1080" cy="340" r="2"/>
    <circle cx="1140" cy="340" r="2"/>
    <circle cx="1200" cy="340" r="2"/>
  </g>

  <!-- Small scattered sparkle stars in background (very faint) -->
  <!-- Top-right area sparkle -->
  <g transform="translate(1050, 60)" opacity="0.18" fill="#A855F7">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2"/>
  </g>
  <g transform="translate(1180, 130)" opacity="0.12" fill="#F59E0B">
    <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5"/>
  </g>
  <g transform="translate(980, 320)" opacity="0.15" fill="#A855F7">
    <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5"/>
  </g>
  <g transform="translate(100, 320)" opacity="0.12" fill="#FC6D26">
    <polygon points="0,-5 1.25,-1.25 5,0 1.25,1.25 0,5 -1.25,1.25 -5,0 -1.25,-1.25"/>
  </g>

  <!-- ======================== -->
  <!-- LEFT SIDE: Icon mark scaled to ~220x220 centered at x=290, y=200 -->
  <!-- Scale factor: 220/332 ~ 0.66 (original icon occupies y=90 to y=422 = 332px, x center 256) -->
  <!-- We'll use a group with transform to position and scale -->
  <g transform="translate(290, 200) scale(0.66)">
    <!-- Trunk line: original from (256,90) to (256,422), relative to center (256,256) -->
    <line x1="0" y1="-166" x2="0" y2="166" stroke="#FC6D26" stroke-width="9" stroke-linecap="round"/>

    <!-- Orange commit dot at branch-out (relative y = 172-256 = -84) -->
    <circle cx="0" cy="-84" r="20" fill="#FC6D26" filter="url(#glow-b)"/>
    <circle cx="0" cy="-84" r="11" fill="#0F172A"/>

    <!-- Orange commit dot at merge-in (relative y = 340-256 = 84) -->
    <circle cx="0" cy="84" r="20" fill="#FC6D26" filter="url(#glow-b)"/>
    <circle cx="0" cy="84" r="11" fill="#0F172A"/>

    <!-- Purple arc: original M 256 172 C 400 172 400 340 256 340 → relative M 0,-84 C 144,-84 144,84 0,84 -->
    <path d="M 0 -84 C 144 -84 144 84 0 84" fill="none" stroke="#A855F7" stroke-width="9" stroke-linecap="round" filter="url(#glow-b)"/>

    <!-- Purple dot at arc midpoint (relative: 358-256=102, 256-256=0) -->
    <circle cx="102" cy="0" r="15" fill="#A855F7" filter="url(#glow-b)"/>
    <circle cx="102" cy="0" r="7" fill="#0F172A"/>

    <!-- Gold sparkle at merge point (0, 84) -->
    <g transform="translate(0, 84)" filter="url(#glow-b-sm)">
      <polygon points="0,-28 7,-7 28,0 7,7 0,28 -7,7 -28,0 -7,-7" fill="#F59E0B"/>
      <circle cx="0" cy="0" r="5" fill="#FDE68A"/>
    </g>
  </g>

  <!-- Vertical divider -->
  <line x1="490" y1="60" x2="490" y2="340" stroke="#334155" stroke-width="1" opacity="0.6"/>

  <!-- ======================== -->
  <!-- RIGHT SIDE: Text block -->

  <!-- Large title -->
  <text
    x="560"
    y="170"
    font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace"
    font-size="72"
    font-weight="700"
    fill="#F8FAFC"
    letter-spacing="-1"
  >Glint</text>

  <!-- Subtitle -->
  <text
    x="560"
    y="225"
    font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace"
    font-size="32"
    fill="#94A3B8"
    letter-spacing="0.5"
  >AI-powered code review for self-hosted GitLab</text>

  <!-- Badge pills -->
  <!-- Merge Requests badge (orange) -->
  <rect x="560" y="258" width="216" height="44" rx="22" fill="#FC6D26"/>
  <text
    x="668"
    y="286"
    text-anchor="middle"
    font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace"
    font-size="20"
    font-weight="600"
    fill="#FFFFFF"
  >Merge Requests</text>

  <!-- Release Notes badge (purple) -->
  <rect x="792" y="258" width="196" height="44" rx="22" fill="#A855F7"/>
  <text
    x="890"
    y="286"
    text-anchor="middle"
    font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace"
    font-size="20"
    font-weight="600"
    fill="#FFFFFF"
  >Release Notes</text>

  <!-- Bottom gradient accent line -->
  <line x1="0" y1="397" x2="1280" y2="397" stroke="url(#bottom-line-grad)" stroke-width="3"/>
</svg>
