<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="90" ry="90" fill="#0F172A"/>

  <!-- Subtle inner vignette -->
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Orange vertical trunk line -->
  <line x1="256" y1="90" x2="256" y2="422" stroke="#FC6D26" stroke-width="7" stroke-linecap="round"/>

  <!-- Orange commit dot at branch-out point (y=172) -->
  <circle cx="256" cy="172" r="18" fill="#FC6D26" filter="url(#glow)"/>
  <circle cx="256" cy="172" r="10" fill="#0F172A"/>

  <!-- Orange commit dot at merge-in point (y=340) -->
  <circle cx="256" cy="340" r="18" fill="#FC6D26" filter="url(#glow)"/>
  <circle cx="256" cy="340" r="10" fill="#0F172A"/>

  <!-- Purple feature branch arc (cubic bezier looping right) -->
  <path d="M 256 172 C 400 172 400 340 256 340" fill="none" stroke="#A855F7" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Purple commit dot at arc midpoint (~358, 256) -->
  <circle cx="358" cy="256" r="13" fill="#A855F7" filter="url(#glow)"/>
  <circle cx="358" cy="256" r="6" fill="#0F172A"/>

  <!-- Gold 4-point sparkle star at merge point (256, 340), layered on top -->
  <g transform="translate(256, 340)" filter="url(#glow-strong)">
    <polygon points="
      0,-26
      6.5,-6.5
      26,0
      6.5,6.5
      0,26
      -6.5,6.5
      -26,0
      -6.5,-6.5
    " fill="#F59E0B"/>
    <!-- Inner detail — tiny center dot -->
    <circle cx="0" cy="0" r="4" fill="#FDE68A"/>
  </g>

  <!-- Project name label -->
  <text
    x="256"
    y="470"
    text-anchor="middle"
    font-family="ui-monospace, 'Cascadia Code', 'Courier New', monospace"
    font-size="36"
    fill="#94A3B8"
    letter-spacing="1"
  >Glint</text>
</svg>
